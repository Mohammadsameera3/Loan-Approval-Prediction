<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="title">

        <i class="fa-solid fa-building-columns"></i>

        <h1>Loan Approval Prediction</h1>

        <p>AI Powered Banking System</p>

    </div>

    <form action="/predict" method="POST">

        <div class="grid">

            <div class="input-box">
                <label>Gender</label>
                <select name="gender">
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div class="input-box">
                <label>Married</label>
                <select name="married">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div class="input-box">
                <label>Dependents</label>
                <select name="dependents">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3+</option>
                </select>
            </div>

            <div class="input-box">
                <label>Education</label>
                <select name="education">
                    <option value="0">Graduate</option>
                    <option value="1">Not Graduate</option>
                </select>
            </div>

            <div class="input-box">
                <label>Self Employed</label>
                <select name="self_employed">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="input-box">
                <label>Credit History</label>
                <select name="credit_history">
                    <option value="1">Good</option>
                    <option value="0">Bad</option>
                </select>
            </div>

            <div class="input-box">
                <label>Applicant Income</label>
                <input type="number" name="applicant_income" required>
            </div>

            <div class="input-box">
                <label>Coapplicant Income</label>
                <input type="number" name="coapplicant_income" required>
            </div>

            <div class="input-box">
<label>Loan Amount (e.g., 120 = ₹120,000)</label>                <input type="number" name="loan_amount" required>
            </div>

            <div class="input-box">
                <label>Loan Term</label>
                <input type="number" name="loan_term" value="360">
            </div>

            <div class="input-box">
                <label>Property Area</label>
                <select name="property_area">
                    <option value="0">Rural</option>
                    <option value="1">Semiurban</option>
                    <option value="2">Urban</option>
                </select>
            </div>

        </div>

        <button type="submit">
            <i class="fa-solid fa-magnifying-glass-chart"></i>
            Predict Loan
        </button>

    </form>

    {% if prediction %}

<div class="result">

    <h2>{{ prediction }}</h2>

    <p><strong>Approval Confidence:</strong> {{ confidence }}%</p>

    <p><strong>Model:</strong> Random Forest Classifier</p>

</div>

{% endif %}

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
